# Opt-in only. About 1.074 GB/s of input. Allow 4.4 GB per second for
# the four-policy comparison, plus headroom. Pool allocations are 704 MiB.
[record]
policy = "deadline-aware"
copy_scheduling = "global"
writer = "sync"
queue_capacity = 128
memory_budget_bytes = 838860800
max_output_bytes = 17179869184
commit_bytes = 134217728
commit_interval_ms = 200
commit_messages = 256
metrics_interval_ms = 10
in_flight = 4
max_borrowed_in_flight = 4

[storage_profile]
sustained_bytes_per_sec = 1300000000
max_stall_ms = 210
max_io_us = 12000
max_sync_ms = 85

[copy_profile]
assumed_min_bytes_per_sec = 1000000000
return_margin_us = 700
scheduling_margin_us = 1500
max_capture_delay_us = 30000

[faults]
stall_at_ms = 250
stall_duration_ms = 200

