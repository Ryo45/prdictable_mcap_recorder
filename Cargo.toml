[package]
name = "predictable_recorder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "recorder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1"
io-uring = "0.7.12"
libc = "0.2"
mcap = { version = "0.23.4", default-features = false }
rustix = { version = "1", features = ["fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
